# Starts one version (version_tag) and waits until it answers.
- name: "Run version {{ version_tag }}"
  environment:
    IMAGE_PREFIX: "{{ image_prefix }}"
    IMAGE_TAG: "{{ version_tag }}"
    HOME: /root
  block:
    - name: Pull images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Start containers
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Frontend answers
      ansible.builtin.uri:
        url: "{{ frontend_url }}"
        status_code: 200
      register: frontend_check
      until: frontend_check.status is defined and frontend_check.status == 200
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"

    - name: Backend accepts connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ backend_port }}"
        timeout: 90
