---
- name: Deploy
  hosts: all
  become: true
  vars:
    app_dir: /opt/app

  tasks:
    - name: Install docker, nginx, python and cron
      ansible.builtin.dnf:
        name: [docker, nginx, python3, python3-pip, cronie]
        state: present

    - name: Start docker and cron
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [docker, crond]

    - name: Create docker plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory

    - name: Install docker compose plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"

    # ---------- Certbot ----------
    - name: Install certbot
      ansible.builtin.pip:
        name: certbot
        virtualenv: /opt/certbot
        virtualenv_command: python3 -m venv

    - name: Link certbot
      ansible.builtin.file:
        src: /opt/certbot/bin/certbot
        dest: /usr/local/bin/certbot
        state: link

    - name: Check DOMAIN and CERT_EMAIL are set
      ansible.builtin.assert:
        that:
          - domain | default('') | length > 0
          - cert_email | default('') | length > 0
        fail_msg: "Set the repo variables DOMAIN and CERT_EMAIL in GitHub (Settings > Secrets and variables > Actions > Variables)"

    - name: Check if the certificate exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: cert

    # Only when there is no certificate yet: free port 80, then ask Let's Encrypt
    - name: Stop nginx so port 80 is free
      ansible.builtin.service:
        name: nginx
        state: stopped
      ignore_errors: true
      when: not cert.stat.exists

    - name: Get the certificate
      ansible.builtin.command: >
        /opt/certbot/bin/certbot certonly --standalone
        -d {{ domain }} --email {{ cert_email }}
        --agree-tos --non-interactive
        --pre-hook "systemctl stop nginx"
        --post-hook "systemctl start nginx"
      when: not cert.stat.exists

    - name: Renew certificate automatically
      ansible.builtin.cron:
        name: certbot renew
        minute: "17"
        hour: "3"
        job: "/usr/local/bin/certbot renew --quiet"

    # ---------- App ----------
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"

    - name: Write .env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          IMAGE_PREFIX={{ image_prefix }}
          IMAGE_TAG={{ image_tag }}

    - name: Write backend.env
      ansible.builtin.copy:
        dest: "{{ app_dir }}/backend.env"
        mode: "0600"
        content: "{{ backend_env }}\n"
      no_log: true

    # ---------- Nginx ----------
    # nginx/nginx.conf.j2 uses {{ domain }} so it always matches the certificate
    - name: Copy nginx config
      ansible.builtin.template:
        src: ../nginx/nginx.conf.j2
        dest: /etc/nginx/conf.d/app.conf
        mode: "0644"
      notify: Reload nginx

    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Apply nginx changes now
      ansible.builtin.meta: flush_handlers

    # ---------- Containers ----------
    - name: Log in to GHCR
      ansible.builtin.shell: echo "$TOKEN" | docker login ghcr.io -u "{{ ghcr_user }}" --password-stdin
      environment:
        TOKEN: "{{ ghcr_token }}"
      no_log: true

    - name: Pull and start containers
      ansible.builtin.shell: docker compose pull && docker compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Log out of GHCR
      ansible.builtin.command: docker logout ghcr.io

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
