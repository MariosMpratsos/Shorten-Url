name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/commit to release"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ENV: ${{ inputs.environment }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch)  REF="$INPUT_REF";    TARGET="$INPUT_ENV" ;;
            push)               REF="$PUSH_REF";     TARGET="production" ;;
            *) echo "Unsupported event: $EVENT"; exit 1 ;;
          esac
          [ -n "$REF" ] || { echo "No ref given"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"

  infrastructure:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.tf-output.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_environment: ${{ needs.prepare.outputs.environment }}

      - name: Extract Server IP
        id: tf-output
        run: |
          cd terraform
          IP=$(terraform output -raw server_public_ip)
          echo "server_ip=$IP" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: client

      - name: Compute image tag
        id: meta
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          FULL_SHA=$(git -C client rev-parse HEAD)
          SAFE_REF=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_REF}-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          PREFIX: ${{ steps.meta.outputs.image_prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          for svc in backend frontend; do
            EXTRA=""
            if [ "$svc" = "frontend" ]; then EXTRA="--build-arg VITE_API_URL=/api"; fi
            docker build $EXTRA \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.version=$TAG" \
              -t "$PREFIX/$svc:$TAG" "./client/$svc"
            docker push "$PREFIX/$svc:$TAG"
          done

  deploy:
    needs: [prepare, build, infrastructure]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible-core>=2.16,<2.18"

      - name: Prepare SSH
        env:
          HOST: ${{ needs.infrastructure.outputs.server_ip }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Run the Ansible playbook
        env:
          HOST: ${{ needs.infrastructure.outputs.server_ip }}
          SSH_USER: ${{ vars.SSH_USER || 'ec2-user' }}
          DOMAIN: ${{ vars.DOMAIN }}
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          set -e
          jq -n '{
            image_prefix: $ENV.IMAGE_PREFIX,
            image_tag: $ENV.IMAGE_TAG,
            domain: $ENV.DOMAIN,
            cert_email: $ENV.CERT_EMAIL,
            ghcr_user: $ENV.GHCR_USER,
            ghcr_token: $ENV.GHCR_TOKEN,
            ssh_user: $ENV.SSH_USER
          }' > "$RUNNER_TEMP/extra-vars.json"

          cd ansible
          ansible-playbook -i "$HOST," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key \
            -e "@$RUNNER_TEMP/extra-vars.json" \
            site.yml
