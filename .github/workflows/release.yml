name: release

on:
  # Automatic: pushing a version tag releases it to production
  #   git tag v1.2.3 && git push origin v1.2.3   (or publish a GitHub Release)
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual: Actions -> release -> Run workflow
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/commit to release (production requires a tag like v1.2.3)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production
  # Automatic: another repo (the client's) announces a new release
  repository_dispatch:
    types: [client-release]

# One release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------
  # 0. Decide what to release and where, and validate it
  # ------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ENV: ${{ inputs.environment }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch)    REF="$INPUT_REF";   TARGET="$INPUT_ENV" ;;
            repository_dispatch)  REF="$PAYLOAD_REF"; TARGET="production" ;;
            push)                 REF="$PUSH_REF";    TARGET="production" ;;
            *) echo "Unsupported event: $EVENT"; exit 1 ;;
          esac
          [ -n "$REF" ] || { echo "No ref given"; exit 1; }
          if [ "$TARGET" = "production" ] && ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases must be a version tag like v1.2.3 (got: $REF)"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 1. Fetch the code at that version and build images
  #    (built once, the same images are promoted staging -> production)
  #    CLIENT_REPO empty = the app lives in this same repo
  # ------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CLIENT_REPO || github.repository }}
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.CLIENT_REPO_TOKEN || github.token }}
          path: client

      - name: Compute image tag
        id: meta
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          FULL_SHA=$(git -C client rev-parse HEAD)
          SAFE_REF=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_REF}-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          PREFIX: ${{ steps.meta.outputs.image_prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          SOURCE_REPO: ${{ vars.CLIENT_REPO || github.repository }}
        run: |
          for svc in backend frontend; do
            EXTRA=""
            # Relative URL: the same image works on every domain (nginx proxies /api)
            if [ "$svc" = "frontend" ]; then EXTRA="--build-arg VITE_API_URL=/api"; fi
            docker build $EXTRA \
              --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPO" \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.version=$TAG" \
              -t "$PREFIX/$svc:$TAG" "./client/$svc"
            docker push "$PREFIX/$svc:$TAG"
          done

  # ------------------------------------------------------------
  # 2. Configure the server and release with Ansible, over SSH
  #    (production waits for approval if "Required reviewers" is set
  #    on the GitHub Environment)
  # ------------------------------------------------------------
  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible-core>=2.16,<2.18"

      - name: Prepare SSH
        env:
          HOST: ${{ vars.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # SERVER_HOST may hold several servers separated by commas
          : > ~/.ssh/known_hosts
          for H in ${HOST//,/ }; do
            for i in $(seq 1 30); do
              OUT=$(ssh-keyscan -T 5 -H "$H" 2>/dev/null || true)
              if [ -n "$OUT" ]; then echo "$OUT" >> ~/.ssh/known_hosts; break; fi
              echo "Waiting for SSH on $H..."; sleep 10
            done
            ssh-keygen -F "$H" > /dev/null || { echo "Server $H not reachable over SSH"; exit 1; }
          done

      - name: Run the Ansible playbook
        env:
          HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ec2-user' }}
          DOMAIN: ${{ vars.DOMAIN }}
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_ENV: ${{ needs.prepare.outputs.environment }}
          RELEASE_ACTOR: ${{ github.actor }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          set -e
          # Secrets go into a private temp file, never onto a command line
          umask 077
          jq -n '{
            image_prefix: $ENV.IMAGE_PREFIX, image_tag: $ENV.IMAGE_TAG,
            domain: $ENV.DOMAIN, cert_email: $ENV.CERT_EMAIL,
            backend_env: $ENV.BACKEND_ENV,
            ghcr_user: $ENV.GHCR_USER, ghcr_token: $ENV.GHCR_TOKEN,
            release_sha: $ENV.RELEASE_SHA, release_env: $ENV.RELEASE_ENV,
            release_actor: $ENV.RELEASE_ACTOR, ssh_user: $ENV.SSH_USER
          }' > "$RUNNER_TEMP/extra-vars.json"

          cd ansible
          ansible-playbook -i "$HOST," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key \
            -e "@$RUNNER_TEMP/extra-vars.json" \
            site.yml

      - name: Release summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          VERSION: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          TARGET_ENV: ${{ needs.prepare.outputs.environment }}
          SOURCE_REPO: ${{ vars.CLIENT_REPO || github.repository }}
        run: |
          {
            echo "## Release $VERSION -> $TARGET_ENV: $STATUS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source repo | $SOURCE_REPO |"
            echo "| Version | $VERSION |"
            echo "| Commit | $SHA |"
            echo "| Image tag | $TAG |"
            echo "| Requested by | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
