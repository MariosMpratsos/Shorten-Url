name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/branch/commit to release (production requires a tag like v1.2.3)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production

  repository_dispatch:
    types: [client-release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ENV: ${{ inputs.environment }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch)   REF="$INPUT_REF";   TARGET="$INPUT_ENV" ;;
            repository_dispatch) REF="$PAYLOAD_REF"; TARGET="production" ;;
            push)                REF="$PUSH_REF";    TARGET="production" ;;
            *) echo "Unsupported event: $EVENT"; exit 1 ;;
          esac
          [ -n "$REF" ] || { echo "No ref given"; exit 1; }
          if [ "$TARGET" = "production" ] && ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases must be a version tag like v1.2.3 (got: $REF)"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CLIENT_REPO || github.repository }}
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.CLIENT_REPO_TOKEN || github.token }}
          path: client

      - name: Compute image tag
        id: meta
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          FULL_SHA=$(git -C client rev-parse HEAD)
          SAFE_REF=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SAFE_REF}-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          PREFIX: ${{ steps.meta.outputs.image_prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          SOURCE_REPO: ${{ vars.CLIENT_REPO || github.repository }}
        run: |
          for svc in backend frontend; do
            EXTRA=""
            if [ "$svc" = "frontend" ]; then EXTRA="--build-arg VITE_API_URL=/api"; fi
            docker build $EXTRA \
              --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPO" \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.version=$TAG" \
              -t "$PREFIX/$svc:$TAG" "./client/$svc"
            docker push "$PREFIX/$svc:$TAG"
          done

  terraform:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    outputs:
      subnet_id: ${{ steps.tf.outputs.subnet_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
          terraform_wrapper: false

      - name: Initialize, Import Existing Resources if Present, and Apply
        id: tf
        working-directory: ./terraform
        run: |
          set -e
          terraform init

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text)

          # Subnet
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=cidr-block,Values=172.31.96.0/20" "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[0].SubnetId" --output text)

          if [ "$SUBNET" != "None" ] && [ -n "$SUBNET" ]; then
            echo "Importing subnet $SUBNET"
            terraform import aws_subnet.main "$SUBNET"

            # Route table (found by its Name tag)
            RTB=$(aws ec2 describe-route-tables \
              --filters "Name=tag:Name,Values=main-terraform-private-rt" "Name=vpc-id,Values=$VPC_ID" \
              --query "RouteTables[0].RouteTableId" --output text)

            if [ "$RTB" != "None" ] && [ -n "$RTB" ]; then
              echo "Importing route table $RTB"
              terraform import aws_route_table.private "$RTB"

              ASSOC=$(aws ec2 describe-route-tables --route-table-ids "$RTB" \
                --query "RouteTables[0].Associations[?SubnetId=='$SUBNET'].RouteTableAssociationId | [0]" \
                --output text)

              if [ "$ASSOC" != "None" ] && [ -n "$ASSOC" ]; then
                echo "Importing route table association"
                terraform import aws_route_table_association.private "$SUBNET/$RTB"
              fi
            fi
          fi

          terraform validate
          terraform apply -auto-approve

          SUBNET_ID=$(terraform output -raw created_subnet_id)
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [prepare, build, terraform]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible-core>=2.16,<2.18"

      - name: Prepare SSH
        env:
          HOST: ${{ vars.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          [ -n "$HOST" ] || { echo "SERVER_HOST variable is empty"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          : > ~/.ssh/known_hosts
          for H in ${HOST//,/ }; do
            for i in $(seq 1 30); do
              OUT=$(ssh-keyscan -T 5 -H "$H" 2>/dev/null || true)
              if [ -n "$OUT" ]; then echo "$OUT" >> ~/.ssh/known_hosts; break; fi
              echo "Waiting for SSH on $H..."
              sleep 10
            done
            ssh-keygen -F "$H" > /dev/null || { echo "Server $H not reachable over SSH"; exit 1; }
          done

      - name: Run the Ansible playbook
        env:
          HOST: ${{ vars.SERVER_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ec2-user' }}
          DOMAIN: ${{ vars.DOMAIN }}
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_ENV: ${{ needs.prepare.outputs.environment }}
          RELEASE_ACTOR: ${{ github.actor }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          SUBNET_ID: ${{ needs.terraform.outputs.subnet_id }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          set -e
          umask 077

          jq -n '{
            image_prefix: $ENV.IMAGE_PREFIX,
            image_tag: $ENV.IMAGE_TAG,
            domain: $ENV.DOMAIN,
            cert_email: $ENV.CERT_EMAIL,
            ghcr_user: $ENV.GHCR_USER,
            ghcr_token: $ENV.GHCR_TOKEN,
            release_sha: $ENV.RELEASE_SHA,
            release_env: $ENV.RELEASE_ENV,
            release_actor: $ENV.RELEASE_ACTOR,
            ssh_user: $ENV.SSH_USER,
            subnet_id: $ENV.SUBNET_ID,
            backend_env: $ENV.BACKEND_ENV
          }' > "$RUNNER_TEMP/extra-vars.json"

          cd ansible
          ansible-playbook -i "$HOST," -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key \
            -e "@$RUNNER_TEMP/extra-vars.json" \
            site.yml

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/extra-vars.json" ~/.ssh/deploy_key

      - name: Release summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          VERSION: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          TARGET_ENV: ${{ needs.prepare.outputs.environment }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SUBNET_ID: ${{ needs.terraform.outputs.subnet_id }}
          SOURCE_REPO: ${{ vars.CLIENT_REPO || github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Release $VERSION -> $TARGET_ENV: $STATUS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source repo | $SOURCE_REPO |"
            echo "| Server host | $SERVER_HOST |"
            echo "| AWS Subnet ID | $SUBNET_ID |"
            echo "| Version | $VERSION |"
            echo "| Commit | $SHA |"
            echo "| Image tag | $TAG |"
            echo "| Requested by | $ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
