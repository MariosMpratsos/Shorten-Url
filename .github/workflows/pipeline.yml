name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  DOMAIN: shorten.bratsos.online

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.prefix.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - id: prefix
        run: |
          # GHCR requires the whole image name to be lowercase (owner AND repo)
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "image_prefix=ghcr.io/$REPO_LC" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          IMG=${{ steps.prefix.outputs.image_prefix }}/backend
          docker build -t $IMG:${{ github.sha }} ./backend
          docker push $IMG:${{ github.sha }}

      - name: Build and push frontend
        run: |
          IMG=${{ steps.prefix.outputs.image_prefix }}/frontend
          docker build \
            --build-arg VITE_API_URL=https://${{ env.DOMAIN }}/api \
            -t $IMG:${{ github.sha }} ./frontend
          docker push $IMG:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B64_COMPOSE=$(base64 -w0 deploy/docker-compose.yml)
          B64_ENV=$(printf '%s\n' "$BACKEND_ENV" | base64 -w0)

          cat > remote.sh <<EOS
          set -e
          export HOME=/root
          for i in \$(seq 1 40); do [ -f /opt/app/.bootstrap-done ] && break; sleep 10; done
          [ -f /opt/app/.bootstrap-done ] || { echo "Server bootstrap not finished"; exit 1; }
          cd /opt/app
          echo $B64_COMPOSE | base64 -d > docker-compose.yml
          echo $B64_ENV | base64 -d > backend.env
          chmod 600 backend.env
          echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
          export IMAGE_PREFIX=$IMAGE_PREFIX IMAGE_TAG=$GITHUB_SHA
          docker compose pull
          docker compose up -d --remove-orphans
          if [ ! -d /etc/letsencrypt/live/$DOMAIN ]; then
            certbot --nginx -d $DOMAIN -m "$CERT_EMAIL" --agree-tos --no-eff-email --non-interactive --redirect \
              || echo "WARNING: certbot failed. Does the DNS A record for $DOMAIN point to this server? Re-run the workflow once it does."
          fi
          EOS

          jq -n --rawfile s remote.sh '{commands: [$s]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
