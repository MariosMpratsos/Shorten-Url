# Containers only listen on localhost; nginx on the host is the public entry point
services:
  backend:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    ports:
      - "127.0.0.1:5000:5000"
    restart: always

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      - backend
